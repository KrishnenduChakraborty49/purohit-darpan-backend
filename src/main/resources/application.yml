spring:
  application:
    name: purohit-darpan
  profiles:
    active: prod
  datasource:
    # Render provides DATABASE_URL, but Spring Boot needs jdbc: prefix. 
    # This config is smart enough to handle both.
    url: ${JDBC_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://dpg-d738kqffte5s73et8ar0-a/purohit_db_kd3e}}
    driver-class-name: org.postgresql.Driver
    # Spring Boot will automatically use the username/password from the URL if provided
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: never

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:purohit-darpan-secure-key-2026-fallback-only}
  expiration: 86400000

cors:
  allowed-origins: "*"

logging:
  level:
    com.purohitdarpan: INFO
