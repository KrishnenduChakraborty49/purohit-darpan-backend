spring:
  application:
    name: purohit-darpan
  profiles:
    active: prod
  datasource:
    # This uses the individual pieces from Render which is 100% reliable
    url: jdbc:postgresql://$:$/$
    username: $
    password: $
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always

server:
  port: $

jwt:
  secret: $
  expiration: 86400000

cors:
  allowed-origins: "*"

logging:
  level:
    com.purohitdarpan: INFO

